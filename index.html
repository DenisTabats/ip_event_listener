<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        .page {
            width: 100%;
        }
        .panel {
            text-align: center;
            font-weight: 700;
            font-size: 28px;
            color: #222;
        }
        .board {
            margin: 0 auto;
            display: flex;
            width: 760px;
            flex-wrap: wrap;
        }
        .board div {
            width: 160px;
            height: 160px;
            margin: 5px;
            border: 4px solid #000;
            background: #06bd67;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            line-height: 148px;
            text-align: center;
        }
        .board div.active {
            background: #ff7f50;
            color: #111;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="panel">
            <p>Сумма значений выделенных ячеек: <b id="sumValue">0</b></p>
            <p>Количество выделенных ячеек: <b id="cntValue">0</b></p>
        </div>
        <div class="board">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>10</div>
            <div>11</div>
            <div>12</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
